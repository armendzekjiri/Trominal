name: Website — build

# Deploys happen in Cloudflare Workers Builds (project `trominal`, connected to this repo),
# which builds website/ with wrangler.toml on every push. This workflow only verifies the build.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.ai/shared/PROJECT_BRIEF.md'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/website-deploy.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

# Avoid stacking builds on rapid pushes.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.23.4.
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @trominal/website build
