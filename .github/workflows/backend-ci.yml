name: Backend CI

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-release.yml'
  push:
    branches:
      - main
      - 'phase/**'
    paths:
      - 'apps/backend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-release.yml'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite, redis, sodium, sqlite3
          coverage: none

      - name: Install Composer dependencies
        working-directory: apps/backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        working-directory: apps/backend
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Pint
        working-directory: apps/backend
        run: ./vendor/bin/pint --test

      - name: Larastan
        working-directory: apps/backend
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

      - name: Pest
        working-directory: apps/backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: ./vendor/bin/pest

  self-hosted-stack:
    name: Self-hosted stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds the image, runs setup.sh + docker compose up from a clean slate, then checks
      # API, admin panel, first-user registration and that a restart does not re-seed.
      - name: Smoke test docker compose stack
        run: ./docker/smoke-test.sh
