name: Crypto CI

on:
  pull_request:
    paths:
      - 'packages/crypto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/crypto-ci.yml'
  push:
    branches:
      - main
      - 'phase/**'
    paths:
      - 'packages/crypto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/crypto-ci.yml'

jobs:
  crypto-parity:
    name: Crypto parity (TS to Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/crypto/parity/target
          key: ${{ runner.os }}-cargo-parity-${{ hashFiles('packages/crypto/parity/Cargo.toml') }}

      - name: Run parity tests
        run: cargo test --manifest-path packages/crypto/parity/Cargo.toml
