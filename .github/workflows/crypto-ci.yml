name: Crypto CI

on:
  pull_request:
    paths:
      - 'packages/crypto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/crypto-ci.yml'
  push:
    branches:
      - main
      - 'phase/**'
    paths:
      - 'packages/crypto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/crypto-ci.yml'

jobs:
  crypto-parity:
    name: Crypto parity (TS to Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/crypto/parity/target
          key: ${{ runner.os }}-cargo-parity-${{ hashFiles('packages/crypto/parity/Cargo.toml') }}

      - name: Run parity tests
        run: cargo test --manifest-path packages/crypto/parity/Cargo.toml
