name: Backend Release

on:
  push:
    tags:
      - 'backend-v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite, redis, sodium, sqlite3
          coverage: none

      - name: Install Composer dependencies
        working-directory: apps/backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        working-directory: apps/backend
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Backend tests
        working-directory: apps/backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: ./vendor/bin/pest

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#backend-v}"
          major_minor="$(printf '%s' "$version" | awk -F. '{print $1"."$2}')"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/trominal-backend"

          {
            echo "version=${version}"
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:${version}"
            echo "${image}:${major_minor}"
            case "$version" in
              *-*) ;;
              *) echo "${image}:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # arm64 for Apple Silicon, Raspberry Pi and ARM cloud servers; without it Compose
      # falls back to building from whatever source is checked out.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/backend/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Trominal Backend
            org.opencontainers.image.description=Laravel API and Filament admin backend for Trominal
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          build-args: |
            TROMINAL_BACKEND_VERSION=${{ steps.image.outputs.version }}

      - name: Create backend GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Trominal Backend ${{ steps.image.outputs.version }}
          draft: true
          prerelease: ${{ contains(steps.image.outputs.version, '-') }}
          # The desktop updater reads releases/latest/download/latest.json, so GitHub's
          # "Latest" release must always be a client release. Never let a backend take it.
          make_latest: false
          generate_release_notes: true
          body: |
            Backend Docker image:

            `${{ steps.image.outputs.image }}:${{ steps.image.outputs.version }}`

            Update self-hosted instances by setting `TROMINAL_BACKEND_IMAGE` to this tag in `.env`, then `docker compose pull && docker compose up -d` (migrations run automatically).
