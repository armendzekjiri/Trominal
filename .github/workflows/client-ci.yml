name: Client CI

on:
  pull_request:
    paths:
      - 'apps/client/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/client-ci.yml'
      - '.github/workflows/client-release.yml'
  push:
    branches:
      - main
      - 'phase/**'
    paths:
      - 'apps/client/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/client-ci.yml'
      - '.github/workflows/client-release.yml'

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:client

      - name: Typecheck
        run: pnpm typecheck

      - name: Crypto unit tests
        run: pnpm --filter @trominal/crypto test

      - name: Client unit tests
        run: pnpm test:client

      - name: Build web client
        run: pnpm --dir apps/client build

      - name: Check Tauri crate
        working-directory: apps/client/src-tauri
        run: cargo check
