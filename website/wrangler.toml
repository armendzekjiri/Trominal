name = "trominal-website"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers + Static Assets. `astro build` writes the Worker to
# `dist/server/` and the prerendered HTML plus public/ assets to
# `dist/client/`, and emits `dist/server/wrangler.json` (derived from this
# file, with `main`/`assets.directory` rewritten). `wrangler deploy` finds it
# via `.wrangler/deploy/config.json`, so deploy from website/ after a build.
main = "@astrojs/cloudflare/entrypoints/server"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# KV namespace for caching GitHub API responses (stars, releases).
[[kv_namespaces]]
binding = "TROMINAL_STATS"
id = "a92e2e82ff994162ae74d86e95dc3108"
preview_id = "992f1a71d02a433ba90c62fdd9d83a9f"

[vars]
GITHUB_REPO = "armendzekjiri/Trominal"
