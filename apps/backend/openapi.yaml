openapi: 3.1.0
info:
  title: Trominal API
  version: 0.1.0
  license:
    name: AGPL-3.0-only
servers:
  - url: http://127.0.0.1:8001
paths:
  /api/server-info:
    get:
      summary: Get public instance registration and feature information.
      responses:
        '200':
          description: Server information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
  /api/health:
    get:
      summary: Get basic health checks for the API, database, and Redis.
      responses:
        '200':
          description: Health status.
  /api/v1/auth/register:
    post:
      summary: Register a user and bootstrap first-user admin mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered with access and refresh tokens.
        '403':
          description: Registration is closed.
        '422':
          description: Validation failed.
  /api/v1/auth/login:
    post:
      summary: Log in with login password and optional TOTP code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access and refresh tokens.
        '422':
          description: Invalid credentials or TOTP code.
        '429':
          description: Too many failed sign-ins for this account or IP address, or too many failed TOTP codes. See Retry-After.
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token and issue a new token pair.
      description: |
        Refresh tokens are single use and rotate within a family that keeps the
        same device for the lifetime of a sign-in. Presenting a token that was
        already rotated is treated as theft: every refresh token in its family
        and every access token issued to its device are revoked, and the call
        fails with 422. Clients must serialise refreshes. Tokens expire after
        `TROMINAL_REFRESH_TOKEN_EXPIRATION_DAYS` (default 7, clamped to 1-30).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                device_name:
                  type: string
      responses:
        '200':
          description: New token pair.
        '422':
          description: Invalid refresh token.
        '429':
          description: Too many refreshes for this IP address or account. See Retry-After.
  /api/v1/auth/logout:
    post:
      summary: Revoke the current access token and active refresh tokens.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out.
        '401':
          description: Unauthenticated.
  /api/v1/me:
    get:
      summary: Get the authenticated user with roles and permissions.
      description: The `vault` object follows the UserVaultMaterial schema.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
        '401':
          description: Unauthenticated.
  /api/v1/auth/forgot-password:
    post:
      summary: Request a password reset link without disclosing account existence.
      description: |
        Always answers 202 with the same body, including when delivery fails.
        The emailed link is `{TROMINAL_CLIENT_URL or APP_URL}/reset-password?token=…&email=…`,
        the client's reset page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Request accepted.
  /api/v1/auth/reset-password:
    post:
      summary: Reset the login password with a reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password reset.
        '422':
          description: Invalid token or validation failed.
  /api/v1/auth/two-factor/enable:
    post:
      summary: Stage a new TOTP secret and return it with its otpauth URI.
      description: |
        The secret is stored as a pending enrollment; the active factor is not
        changed until the pending secret is confirmed via
        `/api/v1/auth/two-factor/verify`. When two-factor authentication is
        already enabled, this call replaces the factor and requires the login
        `password` and a current `code` from the existing authenticator.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorEnableRequest'
      responses:
        '200':
          description: Pending TOTP setup payload.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret:
                    type: string
                  otpauth_uri:
                    type: string
        '401':
          description: Unauthenticated.
        '422':
          description: Two-factor authentication is enabled and the password or current code is missing or invalid.
        '429':
          description: Too many requests or failed codes/passwords for this account. See Retry-After.
  /api/v1/auth/two-factor/verify:
    post:
      summary: Confirm the pending TOTP secret with a six-digit code.
      description: |
        Promotes the pending secret to the active factor. When it replaces an
        existing factor, every other session (access and refresh tokens of
        other devices) is revoked.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^\\d{6}$"
      responses:
        '200':
          description: TOTP enabled.
        '422':
          description: Invalid code, or no pending setup.
        '429':
          description: Too many requests or failed codes/passwords for this account. See Retry-After.
  /api/v1/auth/two-factor/disable:
    post:
      summary: Disable TOTP after password and current code confirmation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                code:
                  type: string
                  pattern: "^\\d{6}$"
      responses:
        '200':
          description: TOTP disabled.
        '422':
          description: Invalid password or code.
        '429':
          description: Too many requests or failed codes/passwords for this account. See Retry-After.
  /api/v1/vault/sync:
    get:
      summary: Delta sync encrypted vault records visible to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Return records updated or soft-deleted after this timestamp.
      responses:
        '200':
          description: Encrypted vault changes grouped by resource type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultSyncResponse'
        '401':
          description: Unauthenticated.
  /api/v1/vault/{resource}:
    get:
      summary: List encrypted vault records for one resource type.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VaultResource'
        - $ref: '#/components/parameters/TeamScope'
      responses:
        '200':
          description: Vault records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultListResponse'
        '403':
          description: Missing permission.
        '422':
          description: The requested team is not one the caller belongs to.
    post:
      summary: Create an encrypted vault record.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VaultResource'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultRecordPayload'
      responses:
        '201':
          description: Vault record created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultRecordResponse'
        '403':
          description: Missing permission, or the caller's team role does not allow creating team records (viewer).
        '422':
          description: Validation failed, or the team is not one the caller belongs to.
  /api/v1/vault/{resource}/{id}:
    get:
      summary: Read one encrypted vault record.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VaultResource'
        - $ref: '#/components/parameters/VaultRecordId'
      responses:
        '200':
          description: Vault record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultRecordResponse'
        '403':
          description: Missing permission, not the owner of a personal record, or not a member of the record's team.
        '404':
          description: Vault record not found.
    patch:
      summary: Update one encrypted vault record.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VaultResource'
        - $ref: '#/components/parameters/VaultRecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultRecordPayload'
      responses:
        '200':
          description: Vault record updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultRecordResponse'
        '403':
          description: Missing permission, not the owner of a personal record, or the caller's team role does not allow writing team records (viewer).
        '404':
          description: Vault record not found.
        '422':
          description: Validation failed.
    delete:
      summary: Soft-delete one encrypted vault record.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VaultResource'
        - $ref: '#/components/parameters/VaultRecordId'
      responses:
        '204':
          description: Vault record soft-deleted.
        '403':
          description: Missing permission, not the owner of a personal record, or the caller's team role does not allow writing team records (viewer).
        '404':
          description: Vault record not found.
  /api/v1/teams/users/lookup:
    get:
      summary: Look up a user public key by email for team-key wrapping.
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: User public key material.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TeamUserKey'
        '403':
          description: Missing team invite permission.
        '404':
          description: User not found or suspended.
  /api/v1/teams:
    get:
      summary: List encrypted teams where the authenticated user is a member.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Teams visible to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
        '403':
          description: Missing team read permission.
    post:
      summary: Create an encrypted team and attach the current user as owner.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '201':
          description: Team created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '403':
          description: Missing team create permission.
        '422':
          description: Validation failed.
  /api/v1/teams/{team_id}:
    get:
      summary: Read one encrypted team with members.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Team record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '403':
          description: Missing permission or not a team member.
        '404':
          description: Team not found.
    patch:
      summary: Update encrypted team metadata.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
      responses:
        '200':
          description: Team updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '403':
          description: Missing permission or not a team owner/admin.
        '422':
          description: Validation failed.
    delete:
      summary: Delete a team. Only team owners may delete teams.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '204':
          description: Team deleted.
        '403':
          description: Missing permission or not a team owner.
        '404':
          description: Team not found.
  /api/v1/teams/{team_id}/members:
    get:
      summary: List members of one team with public key metadata.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Team members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberListResponse'
        '403':
          description: Missing permission or not a team member.
    post:
      summary: Add a team member with their wrapped team key.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberCreateRequest'
      responses:
        '201':
          description: Team member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberResponse'
        '403':
          description: Missing permission or not a team owner/admin.
        '422':
          description: Validation failed.
  /api/v1/teams/{team_id}/members/{member_id}:
    patch:
      summary: Change a team member role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/TeamMemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberUpdateRequest'
      responses:
        '200':
          description: Team member role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberResponse'
        '403':
          description: Missing permission or not allowed to assign the requested role.
        '422':
          description: Validation failed.
    delete:
      summary: Remove a team member after key rotation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/TeamMemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberRemoveRequest'
      responses:
        '204':
          description: Team member removed and team key version rotated.
        '403':
          description: Missing permission or not a team owner/admin.
        '422':
          description: Validation failed.
  /api/v1/me/master-password/change:
    post:
      summary: Atomically rotate all encrypted vault material after a client-side master-password change.
      description: |
        The client derives a new vault key, re-encrypts the private-key envelope and every
        personal (non-team, non-deleted) vault record, and submits them together with the
        `vault_version` it started from. The server applies everything in one transaction or
        nothing at all. It rejects the request when the version is stale, when the item set is
        not exactly the user's current personal records (missing, extra, duplicate, foreign or
        concurrently modified records), when a record's encrypted fields are not all re-encrypted,
        or when the KDF parameters are out of bounds. Requires step-up: the current login
        password, a current TOTP code when 2FA is enabled, and the caller's own active refresh
        token. On success `vault_version` is bumped, every other session is revoked and an audit
        entry is written. Rate limited per user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterPasswordChangeRequest'
      responses:
        '200':
          description: Vault material rotated, version bumped and other sessions invalidated.
          content:
            application/json:
              schema:
                type: object
                required: [vault_version, vault]
                properties:
                  vault_version:
                    type: integer
                  vault:
                    $ref: '#/components/schemas/UserVaultMaterial'
        '401':
          description: Unauthenticated.
        '409':
          description: |
            The vault changed since the client read it (stale `vault_version`, or the submitted
            items do not match the current personal records). Nothing was changed; re-fetch and retry.
        '422':
          description: Validation or step-up failed (password, 2FA code, refresh token, KDF bounds, envelope shape).
        '429':
          description: Too many attempts.
  /api/v1/me/private-key/rebind:
    post:
      summary: Re-bind a legacy private-key envelope to the immutable user ID.
      description: |
        One-time migration for accounts whose private-key envelope was authenticated with the
        email address as associated data. The client decrypts the envelope with the legacy AD,
        re-encrypts it under the same vault key with `trominal:v1:user_private_key:<user id>`,
        and uploads it with the `vault_version` it read. Rejected once the account has already
        been migrated. KDF salt and parameters are unchanged. Bumps `vault_version`, writes an
        audit entry, and is rate limited per user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateKeyRebindRequest'
      responses:
        '200':
          description: Envelope replaced.
          content:
            application/json:
              schema:
                type: object
                required: [vault_version, vault]
                properties:
                  vault_version:
                    type: integer
                  vault:
                    $ref: '#/components/schemas/UserVaultMaterial'
        '401':
          description: Unauthenticated.
        '409':
          description: Stale `vault_version`, or the envelope is already bound to the user ID.
        '422':
          description: Validation failed.
        '429':
          description: Too many attempts.
  /api/v1/ws/ssh-token:
    post:
      summary: Create a short-lived WebSocket SSH token for an owned host or a team host the caller may connect to.
      description: |
        Issues a 30-second, single-use token bound to the requesting client IP
        and to the stated destination (host_id + host + port). Web SSH is
        disabled by default and, when enabled, the backend sees SSH
        credentials in plaintext for the duration of the session.

        WebSocket protocol at `websocket_url` (the token is never put in the URL).
        The first client text frame is JSON and is one of:

        - `{"type":"probe","token","host_id","host","port"}` — runs the SSH key
          exchange without authenticating and replies
          `{"type":"host_key","fingerprint":"SHA256:…","key_type":"ssh-ed25519"}`,
          then closes. Use it on first connection so the user can explicitly
          approve the fingerprint and pin it in the encrypted vault.
        - `{"type":"connect","token","host_id","host","port","host_key_fingerprint",
          "username","cols","rows","auth"}` — `host_key_fingerprint` (OpenSSH
          `SHA256:` format) is required. The proxy compares it with the
          server's host key before sending any credential, then replies
          `{"type":"ready","fingerprint","key_type"}`. Terminal data follows as
          binary frames; `{"type":"resize","cols","rows"}` resizes the PTY.

        Failures reply `{"type":"error","code","message"}` and close. Codes:
        `invalid_frame`, `invalid_token`, `web_ssh_disabled`,
        `destination_mismatch`, `destination_unresolvable`,
        `destination_denied` (non-public address not in
        TROMINAL_WEB_SSH_ALLOWED_CIDRS), `connect_failed`, `host_key_unknown`
        (no pin sent), `host_key_mismatch` (also carries the presented
        `fingerprint` and `key_type`), `host_key_unavailable`, `auth_failed`,
        `session_failed`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SshTokenRequest'
      responses:
        '201':
          description: Single-use SSH WebSocket token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshTokenResponse'
        '403':
          description: Missing hosts.connect permission, web SSH disabled, or the caller's team role does not allow connecting to this team host (viewer).
        '422':
          description: >-
            Host is not visible to the authenticated user (another user's
            personal host, or a team the caller is not a member of), or the
            destination host/port is missing or invalid.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    VaultResource:
      name: resource
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/VaultResourceType'
    VaultRecordId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TeamScope:
      name: team
      in: query
      required: false
      schema:
        type: string
      description: Optional team ID. Omit for personal vault records.
    TeamId:
      name: team_id
      in: path
      required: true
      schema:
        type: string
    TeamMemberId:
      name: member_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    ServerInfo:
      type: object
      required:
        - instance_name
        - backend_version
        - api_version
        - min_client_version
        - registration_mode
        - registration_open
        - web_ssh_enabled
        - setup_token_required
        - team_client_member_ids
        - team_member_key_version_guard
        - team_vault_key_version_guard
        - team_rotation_snapshot_guard
      properties:
        instance_name:
          type: string
        backend_version:
          type: string
        api_version:
          type: string
        min_client_version:
          type: string
        registration_mode:
          type: string
          enum: [single, open, invite, closed]
        registration_open:
          type: boolean
        web_ssh_enabled:
          type: boolean
        setup_token_required:
          type: boolean
          description: True while the instance has no users and a setup token is configured. The token itself is never returned.
        team_client_member_ids:
          type: boolean
          description: The team API accepts client-generated membership IDs for wrapped-key associated data.
        team_member_key_version_guard:
          type: boolean
          description: Adding a member requires a current team key version and is serialized against key rotation.
        team_vault_key_version_guard:
          type: boolean
          description: Team vault writes require the current key version and are serialized against rotation.
        team_rotation_snapshot_guard:
          type: boolean
          description: Rotation rejects incomplete records and stale encrypted team or record snapshots.
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - password_confirmation
        - kdf_salt
        - kdf_params
        - public_key
        - private_key_ciphertext
        - private_key_nonce
      properties:
        id:
          type: string
          description: |
            Optional client-generated ULID for the new user, created within the last few minutes.
            When present, the private-key envelope must be authenticated with
            `trominal:v1:user_private_key:<id>`. When absent, the legacy email-bound AD is assumed
            and the client migrates it on first unlock.
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        password_confirmation:
          type: string
        kdf_salt:
          type: string
          description: Standard base64 encoding of exactly 16 random bytes.
        kdf_params:
          $ref: '#/components/schemas/KdfParams'
        public_key:
          type: string
          description: Base64 X25519 public key (32 bytes).
        private_key_ciphertext:
          type: string
          description: Base64 XChaCha20-Poly1305 ciphertext of the 32-byte X25519 private key (48 bytes with tag).
        private_key_nonce:
          type: string
          description: Base64 24-byte nonce.
        device_name:
          type: string
        invite_code:
          type: string
          description: Required when server registration mode is invite.
        setup_token:
          type: string
          maxLength: 255
          description: |
            Required for the first registration (the account that becomes admin)
            when the operator configured `TROMINAL_SETUP_TOKEN`; see
            `setup_token_required` in server info. Ignored afterwards.
    TwoFactorEnableRequest:
      type: object
      description: Empty for a first enrollment. Both fields are required to replace an enabled factor.
      properties:
        password:
          type: string
          description: Current login password.
        code:
          type: string
          pattern: "^\\d{6}$"
          description: Current code from the active authenticator.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        two_factor_code:
          type: string
          pattern: "^\\d{6}$"
        device_name:
          type: string
    TeamRole:
      type: string
      enum: [owner, admin, member, viewer]
    TeamUserKey:
      type: object
      required: [id, name, email, public_key]
      properties:
        id:
          type: string
        name:
          type:
            - string
            - 'null'
        email:
          type: string
          format: email
        public_key:
          type: string
    TeamMember:
      type: object
      required:
        - id
        - team_id
        - user_id
        - role
        - wrapped_team_key_ciphertext
        - wrapped_team_key_nonce
        - key_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
        team_id:
          type: string
        user_id:
          type: string
        role:
          $ref: '#/components/schemas/TeamRole'
        wrapped_team_key_ciphertext:
          type: string
          description: Client-side wrapped team key for this member.
        wrapped_team_key_nonce:
          type: string
        key_version:
          type: integer
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
        user:
          $ref: '#/components/schemas/TeamUserKey'
    Team:
      type: object
      required:
        - id
        - name_ciphertext
        - name_nonce
        - key_version
        - current_member
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name_ciphertext:
          type: string
        name_nonce:
          type: string
        key_version:
          type: integer
        current_member:
          $ref: '#/components/schemas/TeamMember'
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    TeamCreateRequest:
      type: object
      required:
        - name_ciphertext
        - name_nonce
        - wrapped_team_key_ciphertext
        - wrapped_team_key_nonce
      properties:
        id:
          type: string
          description: Optional client-generated ULID used to bind AEAD associated data before create.
        member_id:
          type: string
          description: Client-generated owner membership ULID used to bind the wrapped key before create.
        name_ciphertext:
          type: string
        name_nonce:
          type: string
        wrapped_team_key_ciphertext:
          type: string
        wrapped_team_key_nonce:
          type: string
    TeamUpdateRequest:
      type: object
      required: [expected_key_version, name_ciphertext, name_nonce]
      properties:
        expected_key_version:
          type: integer
          minimum: 1
          description: Team key version used to encrypt the name.
        name_ciphertext:
          type: string
        name_nonce:
          type: string
    TeamMemberCreateRequest:
      type: object
      required:
        - user_id
        - role
        - expected_key_version
        - wrapped_team_key_ciphertext
        - wrapped_team_key_nonce
      properties:
        member_id:
          type: string
          description: Client-generated membership ULID used to bind the wrapped key before adding the member.
        expected_key_version:
          type: integer
          minimum: 1
          description: Current team key version used to prepare the member's wrapped key.
        user_id:
          type: string
        role:
          $ref: '#/components/schemas/TeamRole'
        wrapped_team_key_ciphertext:
          type: string
        wrapped_team_key_nonce:
          type: string
    TeamMemberUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/TeamRole'
    TeamMemberRemoveRequest:
      type: object
      required: [expected_key_version, expected_name_ciphertext, expected_name_nonce, name_ciphertext, name_nonce, remaining_members, reencrypted_resources]
      properties:
        expected_name_ciphertext:
          type: string
          description: Current encrypted team name used when preparing rotation.
        expected_name_nonce:
          type: string
        expected_key_version:
          type: integer
          minimum: 1
          description: Current team key version used to prepare the rotation; stale rotations are rejected.
        name_ciphertext:
          type: string
          description: Team name re-encrypted under the new team key.
        name_nonce:
          type: string
        remaining_members:
          type: array
          items:
            type: object
            required: [member_id, wrapped_team_key_ciphertext, wrapped_team_key_nonce]
            properties:
              member_id:
                type: string
              wrapped_team_key_ciphertext:
                type: string
              wrapped_team_key_nonce:
                type: string
        reencrypted_resources:
          description: |
            Every team-scoped vault record this team owns, re-encrypted under
            the new team key. Per PROJECT_BRIEF §5.3, the removed user's
            retained plaintext team key must not be able to decrypt any of
            the team's records after rotation; this is enforced by the
            server, which validates that the list covers exactly the team's
            current set of vault rows. Each `fields` map must contain only
            ciphertext / nonce columns for that resource type, including every
            currently populated encrypted field and its nonce.
          type: array
          items:
            type: object
            required: [type, id, original_fields, fields]
            properties:
              type:
                $ref: '#/components/schemas/VaultResourceType'
              id:
                type: string
              original_fields:
                $ref: '#/components/schemas/VaultRecordPayload'
                description: Every non-null encrypted field and nonce read before rotation, used to detect concurrent edits.
              fields:
                $ref: '#/components/schemas/VaultRecordPayload'
    TeamResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Team'
    TeamListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Team'
    TeamMemberResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TeamMember'
    TeamMemberListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
    VaultResourceType:
      type: string
      enum:
        - groups
        - hosts
        - host-credentials
        - snippets
        - identities
        - tunnels
        - ai-settings
    VaultRecordPayload:
      type: object
      additionalProperties: true
      description: Encrypted client payload. Ciphertext fields carry base64 XChaCha20-Poly1305 ciphertexts; nonce fields carry base64 24-byte nonces.
      properties:
        id:
          type: string
          description: Optional client-generated ULID used to bind AEAD associated data before create.
        team_id:
          type:
            - string
            - 'null'
          description: Optional team scope. Omit or null for personal vault records.
        team_key_version:
          type: integer
          minimum: 1
          description: Required for creating or updating team-scoped records. Must match the current team key version.
      examples:
        - name_ciphertext: 'base64-ciphertext'
          name_nonce: 'base64-nonce'
          hostname_ciphertext: 'base64-ciphertext'
          hostname_nonce: 'base64-nonce'
    VaultRecord:
      type: object
      required: [id, type, created_at, updated_at, deleted_at]
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/VaultResourceType'
        team_id:
          type:
            - string
            - 'null'
          description: Present on team-scoped vault resource types. Null means personal scope.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
        deleted_at:
          type:
            - string
            - 'null'
          format: date-time
    VaultRecordResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/VaultRecord'
    VaultListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VaultRecord'
    VaultSyncResponse:
      type: object
      required: [cursor, vault_version, data]
      properties:
        cursor:
          type: string
          format: date-time
        vault_version:
          type: integer
        data:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/VaultRecord'
    KdfParams:
      type: object
      description: |
        Argon2id parameters. Clients and server accept only supported values: version 1,
        alg argon2id, memlimit between 64 MiB and 256 MiB (multiple of 1024), opslimit between
        3 and 10, salt_len 16 and out_len 32. Unknown keys are rejected.
      additionalProperties: false
      required: [version, alg, memlimit, opslimit, salt_len, out_len]
      properties:
        version:
          type: integer
          enum: [1]
        alg:
          type: string
          enum: [argon2id]
        memlimit:
          type: integer
          minimum: 67108864
          maximum: 268435456
          multipleOf: 1024
        opslimit:
          type: integer
          minimum: 3
          maximum: 10
        salt_len:
          type: integer
          enum: [16]
        out_len:
          type: integer
          enum: [32]
    UserVaultMaterial:
      type: object
      required:
        - kdf_salt
        - kdf_params
        - public_key
        - private_key_ciphertext
        - private_key_nonce
        - vault_version
        - private_key_ad_version
      properties:
        kdf_salt:
          type: string
        kdf_params:
          $ref: '#/components/schemas/KdfParams'
        public_key:
          type: string
        private_key_ciphertext:
          type: string
        private_key_nonce:
          type: string
        vault_version:
          type: integer
          description: Bumped whenever the vault key or the private-key envelope changes.
        private_key_ad_version:
          type: integer
          enum: [1, 2]
          description: 1 = envelope bound to the email address (legacy), 2 = bound to the user ID.
    MasterPasswordChangeItem:
      type: object
      required: [type, id, updated_at, fields]
      properties:
        type:
          $ref: '#/components/schemas/VaultResourceType'
        id:
          type: string
        updated_at:
          type:
            - string
            - 'null'
          description: The record's `updated_at` exactly as the client read it; used to detect concurrent edits.
        fields:
          type: object
          description: |
            Every non-null `*_ciphertext` / `*_nonce` pair of the record, re-encrypted under the new
            key with the record's existing associated data. No other columns are accepted.
          additionalProperties:
            type: string
    MasterPasswordChangeRequest:
      type: object
      required:
        - vault_version
        - current_password
        - current_refresh_token
        - new_kdf_salt
        - new_kdf_params
        - private_key_ciphertext
        - private_key_nonce
        - items
      properties:
        vault_version:
          type: integer
          description: The `vault_version` the client read before re-encrypting.
        current_password:
          type: string
          description: Current login password (step-up). Never logged.
        two_factor_code:
          type: string
          pattern: "^\\d{6}$"
          description: Required when two-factor authentication is enabled.
        current_refresh_token:
          type: string
          description: This device's active refresh token; it is the only session kept.
        new_kdf_salt:
          type: string
          description: Standard base64 encoding of exactly 16 random bytes.
        new_kdf_params:
          $ref: '#/components/schemas/KdfParams'
        private_key_ciphertext:
          type: string
          description: |
            The user's X25519 private key re-encrypted under the new vault key with associated data
            `trominal:v1:user_private_key:<user id>` (base64, 48 bytes).
        private_key_nonce:
          type: string
          description: Base64 24-byte nonce.
        items:
          type: array
          description: Exactly one entry per current personal vault record of every type.
          items:
            $ref: '#/components/schemas/MasterPasswordChangeItem'
    PrivateKeyRebindRequest:
      type: object
      required: [vault_version, private_key_ciphertext, private_key_nonce]
      properties:
        vault_version:
          type: integer
        private_key_ciphertext:
          type: string
          description: Private key re-encrypted under the unchanged vault key with the user-ID AD (base64, 48 bytes).
        private_key_nonce:
          type: string
          description: Base64 24-byte nonce.
    SshTokenRequest:
      type: object
      required: [host_id, host, port]
      description: >-
        Host addresses are end-to-end encrypted, so the client states the
        destination it is about to connect to. The token stores only a keyed
        hash of host + port; the proxy refuses any connect or probe frame whose
        host_id, host or port differs.
      properties:
        host_id:
          type: string
          description: ID of a host owned by the authenticated user.
        host:
          type: string
          maxLength: 255
          description: Hostname or IP literal (IPv6 may be bracketed). Compared case-insensitively.
        port:
          type: integer
          minimum: 1
          maximum: 65535
    SshTokenResponse:
      type: object
      required: [token, expires_at, websocket_url]
      properties:
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: >-
            Plain single-use token shown once; the server stores only a SHA-256
            hash. Send it as the `token` field of the first WebSocket frame,
            never in the URL. Bound to the requesting client IP unless
            TROMINAL_WEB_SSH_BIND_IP=false.
        expires_at:
          type: string
          format: date-time
        websocket_url:
          type: string
          description: WebSocket endpoint of the SSH proxy. Contains no credentials.
